<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="Komorebi Minimalist Whitepaper Reader Mockup">
  <defs>
    <linearGradient id="bgKomo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF6E5"/>
      <stop offset="100%" stop-color="#EDE7D5"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgKomo)"/>
  <rect x="25" y="25" width="750" height="450" rx="6" fill="#FCF6E5" stroke="#DCD6C3" stroke-width="1.5"/>

  <!-- Top Navigation & Reading Progress -->
  <line x1="25" y1="65" x2="775" y2="65" stroke="#DCD6C3" stroke-width="1"/>
  <rect x="25" y="64" width="310" height="2" fill="#242420" /> <!-- Reading progress line -->

  <circle cx="50" cy="45" r="4.5" fill="#DCD6C3" />
  <circle cx="66" cy="45" r="4.5" fill="#DCD6C3" />
  <circle cx="82" cy="45" r="4.5" fill="#DCD6C3" />

  <text x="400" y="49" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#6F6A5E">KOMOREBI // DISTRACTION-FREE WHITEPAPER READER</text>
  <text x="745" y="49" text-anchor="end" font-family="-apple-system, sans-serif" font-size="11" fill="#6F6A5E">PAGE 4 / 18 · 41%</text>

  <!-- Dual Editorial Layout: Left Main Column, Right Marginalia -->
  <g transform="translate(60, 95)">
    <!-- Document Header -->
    <text x="0" y="30" font-family="serif" font-size="26" font-weight="700" fill="#242420">On the Elegance of Sparse Attention Manifolds</text>
    <text x="0" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" letter-spacing="1" fill="#6F6A5E">OCTOBER 2026 · PEER-REVIEWED DRAFT · TYPE: MATHEMATICAL FOUNDATIONS</text>
    <line x1="0" y1="70" x2="680" y2="70" stroke="#DCD6C3" stroke-width="1"/>

    <!-- Left Column: Primary Text -->
    <g transform="translate(0, 95)">
      <text x="0" y="16" font-family="serif" font-size="14" fill="#242420">Modern transformer architectures expend quadratic computation evaluating fully connected token graphs.</text>
      <text x="0" y="40" font-family="serif" font-size="14" fill="#242420">However, empirical entropy measurements show that over 93% of cross-attention weights decay</text>
      <text x="0" y="64" font-family="serif" font-size="14" fill="#242420">exponentially beyond local contextual neighborhoods.</text>

      <!-- LaTeX equation box -->
      <rect x="0" y="90" width="450" height="68" rx="4" fill="#EDE8D7" stroke="#DCD6C3" stroke-width="1"/>
      <text x="225" y="128" text-anchor="middle" font-family="serif" font-style="italic" font-size="16" fill="#242420">A(Q, K, V) = softmax( (Q·Kᵀ / √d_k) ⊙ M_sparse ) · V</text>
      <text x="430" y="146" text-anchor="end" font-family="monospace" font-size="9" fill="#6F6A5E">(Eq. 3)</text>

      <text x="0" y="188" font-family="serif" font-size="14" fill="#242420">By constraining attention mechanisms to dynamic Riemannian geodesics, we preserve semantic depth</text>
      <text x="0" y="212" font-family="serif" font-size="14" fill="#242420">while reducing asymptotic complexity to O(N log N) on commodity hardware.</text>
    </g>

    <!-- Right Column: Editorial Marginalia / Side Notes -->
    <g transform="translate(485, 95)">
      <line x1="-15" y1="0" x2="-15" y2="240" stroke="#DCD6C3" stroke-width="0.8"/>

      <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#6F6A5E">MARGINALIA § 3.1</text>
      <text x="0" y="36" font-family="-apple-system, sans-serif" font-size="11" fill="#6F6A5E">See Vaswani et al. (2017)</text>
      <text x="0" y="52" font-family="-apple-system, sans-serif" font-size="11" fill="#6F6A5E">for original quadratic bounds.</text>

      <rect x="0" y="80" width="190" height="95" rx="4" fill="#EDE8D7" stroke="#DCD6C3" stroke-width="1"/>
      <text x="12" y="102" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#242420">KEY TAKEAWAY</text>
      <text x="12" y="122" font-family="-apple-system, sans-serif" font-size="10" fill="#6F6A5E">Sparse geodesic bounds</text>
      <text x="12" y="138" font-family="-apple-system, sans-serif" font-size="10" fill="#6F6A5E">eliminate memory bottlenecks</text>
      <text x="12" y="154" font-family="-apple-system, sans-serif" font-size="10" fill="#8C6D4F">in long-context workflows.</text>
    </g>
  </g>
</svg>


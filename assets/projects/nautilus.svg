<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="Nautilus Engine Procedural Terrain Mesh Mockup">
  <defs>
    <linearGradient id="bgNaut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE8D7"/>
      <stop offset="100%" stop-color="#E2DCC9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgNaut)"/>
  
  <!-- Outer Frame & Grid -->
  <rect x="25" y="25" width="750" height="450" rx="6" fill="#FCF6E5" stroke="#DCD6C3" stroke-width="1.5"/>

  <!-- Top Bar -->
  <line x1="25" y1="65" x2="775" y2="65" stroke="#DCD6C3" stroke-width="1"/>
  <circle cx="50" cy="45" r="4.5" fill="#DCD6C3" />
  <circle cx="66" cy="45" r="4.5" fill="#DCD6C3" />
  <circle cx="82" cy="45" r="4.5" fill="#DCD6C3" />
  <text x="400" y="49" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#6F6A5E">NAUTILUS ENGINE // PROCEDURAL TERRAIN &amp; SPIRALS</text>
  <text x="745" y="49" text-anchor="end" font-family="monospace" font-size="10" fill="#6F6A5E">60.0 FPS · WEBGL 2</text>

  <!-- Left Parameter Dashboard -->
  <rect x="45" y="85" width="190" height="365" rx="4" fill="#EDE8D7" stroke="#DCD6C3" stroke-width="1"/>
  <text x="65" y="115" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#6F6A5E">GEOMETRY MATRIX</text>
  
  <text x="65" y="145" font-family="monospace" font-size="11" fill="#242420">SEED: 0x8F942A</text>
  <line x1="65" y1="155" x2="215" y2="155" stroke="#DCD6C3" stroke-width="1"/>
  
  <text x="65" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6F6A5E">Simplex Octaves</text>
  <rect x="65" y="190" width="150" height="4" rx="2" fill="#DCD6C3"/>
  <rect x="65" y="190" width="105" height="4" rx="2" fill="#242420"/>

  <text x="65" y="225" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6F6A5E">Hydraulic Erosion</text>
  <rect x="65" y="235" width="150" height="4" rx="2" fill="#DCD6C3"/>
  <rect x="65" y="235" width="125" height="4" rx="2" fill="#8C6D4F"/>

  <text x="65" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6F6A5E">Nautilus Fibonacci Ratio</text>
  <text x="65" y="290" font-family="monospace" font-size="12" font-weight="700" fill="#242420">Φ = 1.6180339887</text>

  <g transform="translate(65, 320)">
    <rect width="150" height="105" rx="3" fill="#FCF6E5" stroke="#DCD6C3" stroke-width="1"/>
    <text x="12" y="24" font-family="monospace" font-size="9" fill="#6F6A5E">TRIANGLES: 1,048,576</text>
    <text x="12" y="44" font-family="monospace" font-size="9" fill="#6F6A5E">VERTICES:  526,338</text>
    <text x="12" y="64" font-family="monospace" font-size="9" fill="#6F6A5E">DRAW CALLS: 1 (INST)</text>
    <text x="12" y="84" font-family="monospace" font-size="9" fill="#8C6D4F">STATUS: GPU BOUND</text>
  </g>

  <!-- Center Isometric Wireframe / Contour Curves (Clean Editorial Style) -->
  <g transform="translate(490, 260)">
    <!-- Concentric Nautilus Shell Wireframe -->
    <ellipse cx="0" cy="0" rx="220" ry="130" fill="none" stroke="#DCD6C3" stroke-width="1"/>
    <ellipse cx="10" cy="-5" rx="180" ry="105" fill="none" stroke="#DCD6C3" stroke-width="1"/>
    <ellipse cx="20" cy="-10" rx="140" ry="80" fill="none" stroke="#DCD6C3" stroke-width="1"/>
    <ellipse cx="30" cy="-15" rx="100" ry="55" fill="none" stroke="#DCD6C3" stroke-width="1"/>
    <ellipse cx="40" cy="-20" rx="60" ry="35" fill="none" stroke="#DCD6C3" stroke-width="1"/>
    
    <!-- Wireframe Isometric Topo Lines -->
    <path d="M -180 80 Q -100 -20, 0 30 T 180 -40" fill="none" stroke="#242420" stroke-width="1.8"/>
    <path d="M -200 60 Q -120 -40, -10 10 T 170 -60" fill="none" stroke="#242420" stroke-width="1.6"/>
    <path d="M -210 40 Q -130 -60, -20 -10 T 160 -80" fill="none" stroke="#242420" stroke-width="1.4"/>
    <path d="M -215 20 Q -140 -80, -30 -30 T 150 -100" fill="none" stroke="#6F6A5E" stroke-width="1.2"/>
    <path d="M -210 0 Q -145 -100, -40 -50 T 130 -120" fill="none" stroke="#6F6A5E" stroke-width="1"/>

    <!-- Cross hatch grid mesh -->
    <path d="M -120 70 L -40 -110" fill="none" stroke="#DCD6C3" stroke-dasharray="2,2"/>
    <path d="M -60 75 L 20 -115" fill="none" stroke="#DCD6C3" stroke-dasharray="2,2"/>
    <path d="M 0 78 L 80 -105" fill="none" stroke="#DCD6C3" stroke-dasharray="2,2"/>
    <path d="M 60 70 L 140 -90" fill="none" stroke="#DCD6C3" stroke-dasharray="2,2"/>

    <!-- Peak Elevation Marker -->
    <circle cx="-30" cy="-30" r="5" fill="#8C6D4F"/>
    <line x1="-30" y1="-30" x2="-30" y2="-90" stroke="#8C6D4F" stroke-width="1.5"/>
    <rect x="-80" y="-115" width="100" height="22" rx="3" fill="#242420"/>
    <text x="-30" y="-100" text-anchor="middle" font-family="monospace" font-size="10" fill="#FCF6E5">ELEV: +2,840m</text>
  </g>
</svg>


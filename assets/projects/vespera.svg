<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="Vespera Ambient Soundscape Mockup">
  <defs>
    <linearGradient id="bgVesp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF6E5"/>
      <stop offset="100%" stop-color="#F2EBD7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgVesp)"/>
  <rect x="25" y="25" width="750" height="450" rx="6" fill="#FCF6E5" stroke="#DCD6C3" stroke-width="1.5"/>

  <!-- Header -->
  <line x1="25" y1="65" x2="775" y2="65" stroke="#DCD6C3" stroke-width="1"/>
  <circle cx="50" cy="45" r="4.5" fill="#DCD6C3" />
  <circle cx="66" cy="45" r="4.5" fill="#DCD6C3" />
  <circle cx="82" cy="45" r="4.5" fill="#DCD6C3" />
  <text x="400" y="49" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#6F6A5E">VESPERA // AMBIENT CIRCADIAN SOUND ENGINE</text>
  <text x="745" y="49" text-anchor="end" font-family="monospace" font-size="10" fill="#6F6A5E">BINAURAL 432Hz</text>

  <!-- Left: Circadian Ring / Timer -->
  <g transform="translate(230, 270)">
    <!-- Dial track -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#EDE8D7" stroke-width="12"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#242420" stroke-width="12" stroke-dasharray="879" stroke-dashoffset="260" stroke-linecap="round"/>
    
    <!-- Concentric tick marks -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#DCD6C3" stroke-width="1" stroke-dasharray="3,7"/>
    <circle cx="0" cy="0" r="90" fill="#EDE8D7"/>

    <!-- Center Timer Readout -->
    <text x="0" y="-12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#6F6A5E">DEEP FOCUS</text>
    <text x="0" y="24" text-anchor="middle" font-family="monospace, -apple-system" font-size="34" font-weight="700" fill="#242420">45:00</text>
    <text x="0" y="46" text-anchor="middle" font-family="monospace" font-size="10" fill="#8C6D4F">SESSION 3 OF 4</text>
  </g>

  <!-- Right: Generative Acoustic Waveforms & Mixers -->
  <g transform="translate(440, 100)">
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6F6A5E">ACOUSTIC FREQUENCIES</text>
    
    <!-- Channel 1: Rain & Thunder -->
    <rect x="0" y="40" width="295" height="60" rx="4" fill="#EDE8D7" stroke="#DCD6C3" stroke-width="1"/>
    <text x="15" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#242420">Pacific Rain &amp; Distant Thunder</text>
    <text x="15" y="85" font-family="monospace" font-size="10" fill="#6F6A5E">BROWN NOISE · 72% GAIN</text>
    <!-- Mini wave -->
    <path d="M 190 70 Q 200 55, 210 70 T 230 70 T 250 70 T 270 70" fill="none" stroke="#242420" stroke-width="1.5"/>

    <!-- Channel 2: Tape Hiss & Vintage Piano -->
    <rect x="0" y="115" width="295" height="60" rx="4" fill="#EDE8D7" stroke="#DCD6C3" stroke-width="1"/>
    <text x="15" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#242420">Reel-to-Reel Tape Hiss</text>
    <text x="15" y="160" font-family="monospace" font-size="10" fill="#6F6A5E">ANALOG FLUTTER · 40% GAIN</text>
    <path d="M 190 145 Q 198 135, 206 145 T 222 145 T 238 145 T 254 145 T 270 145" fill="none" stroke="#8C6D4F" stroke-width="1.5"/>

    <!-- Channel 3: Beta Waves / Forest Breeze -->
    <rect x="0" y="190" width="295" height="60" rx="4" fill="#EDE8D7" stroke="#DCD6C3" stroke-width="1"/>
    <text x="15" y="215" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#242420">Forest Canopy Wind</text>
    <text x="15" y="235" font-family="monospace" font-size="10" fill="#6F6A5E">PINK NOISE · 58% GAIN</text>
    <path d="M 190 220 Q 210 205, 230 220 T 270 220" fill="none" stroke="#6F6A5E" stroke-width="1.5"/>

    <!-- Bottom Audio Spectrum Visualization -->
    <rect x="0" y="268" width="295" height="70" rx="4" fill="#FCF6E5" stroke="#DCD6C3" stroke-width="1"/>
    <g transform="translate(15, 320)">
      <!-- Spectrum bars -->
      <line x1="0" y1="0" x2="0" y2="-12" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="0" x2="12" y2="-24" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="24" y1="0" x2="24" y2="-38" stroke="#8C6D4F" stroke-width="3" stroke-linecap="round"/>
      <line x1="36" y1="0" x2="36" y2="-28" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="48" y1="0" x2="48" y2="-45" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="60" y1="0" x2="60" y2="-32" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="72" y1="0" x2="72" y2="-20" stroke="#8C6D4F" stroke-width="3" stroke-linecap="round"/>
      <line x1="84" y1="0" x2="84" y2="-15" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="96" y1="0" x2="96" y2="-30" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="108" y1="0" x2="108" y2="-42" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="120" y1="0" x2="120" y2="-26" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="132" y1="0" x2="132" y2="-18" stroke="#8C6D4F" stroke-width="3" stroke-linecap="round"/>
      <line x1="144" y1="0" x2="144" y2="-10" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="156" y1="0" x2="156" y2="-22" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="168" y1="0" x2="168" y2="-35" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="180" y1="0" x2="180" y2="-28" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="192" y1="0" x2="192" y2="-14" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="204" y1="0" x2="204" y2="-8" stroke="#6F6A5E" stroke-width="3" stroke-linecap="round"/>
      <line x1="216" y1="0" x2="216" y2="-18" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="228" y1="0" x2="228" y2="-25" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="240" y1="0" x2="240" y2="-12" stroke="#242420" stroke-width="3" stroke-linecap="round"/>
      <line x1="252" y1="0" x2="252" y2="-6" stroke="#6F6A5E" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>


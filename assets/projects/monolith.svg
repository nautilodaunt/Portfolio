<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="Monolith Service Mesh CLI Mockup">
  <defs>
    <linearGradient id="bgMono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE8D7"/>
      <stop offset="100%" stop-color="#E5DEC9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgMono)"/>
  <rect x="25" y="25" width="750" height="450" rx="6" fill="#242420" stroke="#6F6A5E" stroke-width="1.5"/>

  <!-- Terminal Top Bar -->
  <line x1="25" y1="65" x2="775" y2="65" stroke="#383832" stroke-width="1"/>
  <circle cx="50" cy="45" r="4.5" fill="#6F6A5E" />
  <circle cx="66" cy="45" r="4.5" fill="#6F6A5E" />
  <circle cx="82" cy="45" r="4.5" fill="#6F6A5E" />
  <text x="400" y="49" text-anchor="middle" font-family="monospace" font-size="11" fill="#EDE8D7">monolith-cli --cluster=prod-us-east-1 (topology daemon)</text>

  <!-- Terminal Content Area -->
  <g transform="translate(50, 95)">
    <!-- Command Prompt -->
    <text x="0" y="15" font-family="monospace" font-size="12" fill="#DCD6C3">$ monolith status --mesh --metrics</text>
    
    <!-- Status summary banner -->
    <text x="0" y="45" font-family="monospace" font-size="11" fill="#A67C47">[OK] Service mesh converged in 1.4s · 32 Pods · 8 Ingress Gateways</text>
    <line x1="0" y1="58" x2="700" y2="58" stroke="#383832" stroke-width="1"/>

    <!-- Service Mesh Table -->
    <text x="0" y="80" font-family="monospace" font-size="11" font-weight="700" fill="#EDE8D7">SERVICE             STATUS     UPTIME    LATENCY (p99)   TRAFFIC     HEALTH</text>
    <line x1="0" y1="90" x2="700" y2="90" stroke="#383832" stroke-width="1"/>

    <text x="0" y="112" font-family="monospace" font-size="11" fill="#EDE8D7">api-gateway-edge    RUNNING    14d 6h    4.2ms           14.2k req/s [||||||||||] 100%</text>
    <text x="0" y="134" font-family="monospace" font-size="11" fill="#EDE8D7">auth-token-verifier RUNNING    14d 6h    1.1ms           12.8k req/s [||||||||||] 100%</text>
    <text x="0" y="156" font-family="monospace" font-size="11" fill="#EDE8D7">event-bus-broker    RUNNING    28d 2h    0.8ms           48.0k msg/s [||||||||||] 100%</text>
    <text x="0" y="178" font-family="monospace" font-size="11" fill="#EDE8D7">search-indexer      SYNCING    2h 14m    12.4ms          1.4k doc/s  [||||||||..]  82%</text>
    <text x="0" y="200" font-family="monospace" font-size="11" fill="#EDE8D7">worker-scheduler    IDLE       14d 6h    0.3ms           0 queue     [||||||||||] 100%</text>

    <!-- Visual ASCII/Vector Topology Box -->
    <g transform="translate(0, 230)">
      <rect width="700" height="125" rx="4" fill="#1C1C18" stroke="#383832" stroke-width="1"/>
      <text x="18" y="25" font-family="monospace" font-size="10" fill="#6F6A5E">// LIVE TOPOLOGY ROUTING PIPELINE</text>

      <!-- Nodes -->
      <rect x="25" y="45" width="110" height="42" rx="3" fill="#2E2E28" stroke="#6F6A5E" stroke-width="1"/>
      <text x="80" y="70" text-anchor="middle" font-family="monospace" font-size="10" fill="#EDE8D7">Edge Router</text>

      <line x1="135" y1="66" x2="200" y2="66" stroke="#EDE8D7" stroke-width="1.2" stroke-dasharray="4,3"/>

      <rect x="200" y="45" width="120" height="42" rx="3" fill="#2E2E28" stroke="#6F6A5E" stroke-width="1"/>
      <text x="260" y="70" text-anchor="middle" font-family="monospace" font-size="10" fill="#EDE8D7">Envoy Proxy</text>

      <line x1="320" y1="66" x2="385" y2="66" stroke="#EDE8D7" stroke-width="1.2" stroke-dasharray="4,3"/>

      <rect x="385" y="45" width="130" height="42" rx="3" fill="#2E2E28" stroke="#A67C47" stroke-width="1"/>
      <text x="450" y="70" text-anchor="middle" font-family="monospace" font-size="10" fill="#FCF6E5">gRPC Cluster</text>

      <line x1="515" y1="66" x2="575" y2="66" stroke="#EDE8D7" stroke-width="1.2" stroke-dasharray="4,3"/>

      <rect x="575" y="45" width="105" height="42" rx="3" fill="#2E2E28" stroke="#6F6A5E" stroke-width="1"/>
      <text x="627" y="70" text-anchor="middle" font-family="monospace" font-size="10" fill="#EDE8D7">Raft Store</text>

      <text x="18" y="108" font-family="monospace" font-size="9" fill="#A67C47">TLS 1.3 mTLS VERIFIED · ZERO TRUST CERTIFICATE ROTATION ACTIVE</text>
    </g>
  </g>
</svg>


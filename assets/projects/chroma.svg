    <!-- Match 1 -->
    <rect x="12" y="42" width="246" height="52" rx="3" fill="#FCF6E5" stroke="#DCD6C3" stroke-width="1"/>
    <text x="22" y="60" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#242420">1. manifold_hypothesis.md</text>
    <text x="22" y="78" font-family="monospace" font-size="10" fill="#8C6D4F">COS: 0.984 · DIST: 0.016</text>

    <!-- Match 2 -->
    <rect x="12" y="104" width="246" height="52" rx="3" fill="#FCF6E5" stroke="#DCD6C3" stroke-width="1"/>
    <text x="22" y="122" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#242420">2. riemannian_metrics.pdf</text>
    <text x="22" y="140" font-family="monospace" font-size="10" fill="#6F6A5E">COS: 0.941 · DIST: 0.059</text>

    <!-- Match 3 -->
    <rect x="12" y="166" width="246" height="52" rx="3" fill="#FCF6E5" stroke="#DCD6C3" stroke-width="1"/>
    <text x="22" y="184" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#242420">3. dense_retrieval_v2.go</text>
    <text x="22" y="202" font-family="monospace" font-size="10" fill="#6F6A5E">COS: 0.918 · DIST: 0.082</text>

    <!-- Match 4 -->
    <rect x="12" y="228" width="246" height="52" rx="3" fill="#FCF6E5" stroke="#DCD6C3" stroke-width="1"/>
    <text x="22" y="246" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#242420">4. hnsw_indexing_paper.txt</text>
    <text x="22" y="264" font-family="monospace" font-size="10" fill="#6F6A5E">COS: 0.895 · DIST: 0.105</text>

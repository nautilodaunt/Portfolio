    <circle cx="95" cy="80" r="4" fill="#6F6A5E"/>
    <circle cx="125" cy="75" r="5" fill="#242420"/>
    <circle cx="105" cy="110" r="4" fill="#6F6A5E"/>
    <circle cx="130" cy="100" r="4" fill="#242420"/>
    <text x="110" y="55" text-anchor="middle" font-family="monospace" font-size="9" fill="#6F6A5E">CLUSTER: COGNITION</text>

    <!-- Cluster B (Target Nearest Neighbors) -->
    <circle cx="280" cy="180" r="70" fill="#EDE8D7" fill-opacity="0.6" stroke="#8C6D4F" stroke-width="1.2"/>
    <circle cx="280" cy="180" r="6" fill="#8C6D4F"/>
    
    <!-- Nearest Neighbor Lines -->

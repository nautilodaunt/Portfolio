    <line x1="280" y1="180" x2="315" y2="160" stroke="#8C6D4F" stroke-width="1.2"/>
    <line x1="280" y1="180" x2="295" y2="225" stroke="#8C6D4F" stroke-width="1.2"/>
    <line x1="280" y1="180" x2="240" y2="205" stroke="#8C6D4F" stroke-width="1.2"/>

    <circle cx="250" cy="150" r="4.5" fill="#242420"/>
    <circle cx="315" cy="160" r="4.5" fill="#242420"/>
    <circle cx="295" cy="225" r="4.5" fill="#242420"/>
    <circle cx="240" cy="205" r="4.5" fill="#242420"/>

    <text x="280" y="270" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#242420">QUERY POINT [0.892, 0.412]</text>
  </g>

